baseURL = "https://seckuhn.github.io/hacking-lab/"
languageCode = "de-DE"
title = "Hacking Lab"
theme = "PaperMod"

[params]
  mainSections = ["posts", "darknet", "hardware", "pentesting", "reverse-engineering", "social-engineering"]
  description = "Notizen und Write-ups aus meinem Hacking Lab"
  ShowReadingTime = true
  defaultTheme = "auto"

[menu]
  [[menu.main]]
    name = "Beiträge"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    name = "Hardware"
